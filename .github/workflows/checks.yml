name: Polysignal checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      POLYSIGNAL_RUN_NETWORK_TESTS: '0'
      POLYSIGNAL_RUN_LIVE_REDDIT_TESTS: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install verified dependencies and package
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Structure and Python errors
        run: |
          python scripts/check_repository.py
          python -m ruff check --select F821,F822,F823,E9 src tests scripts
      - name: Frontend syntax
        run: node scripts/check_frontend.cjs
      - name: Offline tests
        run: python -m pytest -q --junitxml=artifacts/tests.xml
      - name: Build source and wheel; check isolated installation
        run: |
          python -m build --no-isolation
          python scripts/check_wheel.py
      - name: Bash syntax
        if: runner.os == 'Linux'
        run: bash -n run_app.sh
      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) > $null
            if ($errors) { throw ($errors | Out-String) }
          }
