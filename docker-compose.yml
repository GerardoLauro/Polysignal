# PolySignal — local development infrastructure.
#
# This compose file is intentionally minimal. It provides the dependencies the
# project needs for local experimentation. It is NOT a production deployment.
#
# Services:
#   - neo4j: knowledge-graph store. Bolt on 7687, browser UI on 7474.
#
# Usage:
#   docker compose up -d neo4j
#   docker compose down
#
# Credentials in this file are development defaults and must NOT be reused
# anywhere outside the local machine.

services:
  neo4j:
    image: neo4j:5.20-community
    container_name: polysignal-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"   # HTTP browser
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/polysignal-dev"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
